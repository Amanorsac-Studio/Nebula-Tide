name: Build Release (Windows + macOS + iOS)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["ci-*"]     # test builds without creating a release

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  windows:
    if: ${{ !startsWith(github.ref, 'refs/heads/ci-') }}   # ci-* branches: android only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # no explicit generator: CMake picks whichever Visual Studio the runner image has
        run: cmake -S . -B build -A x64

      - name: Build (Standalone + VST3)
        run: cmake --build build --config Release --target NebulaTide_Standalone NebulaTide_VST3

      # The sound library is too large for git. CI fetches it from the
      # SOUNDS_URL repository variable (set it in Settings → Variables → Actions
      # to wherever you host NebulaTide-Sounds-*.zip) and bundles it in.
      - name: Fetch sound library
        shell: pwsh
        env:
          SOUNDS_URL: ${{ endsWith(vars.SOUNDS_URL, '.zip') && vars.SOUNDS_URL || 'https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip' }}
        run: |
          "Downloading $env:SOUNDS_URL"
          # Try the configured URL, then the known-good release asset; retry each on any error.
          $urls = @($env:SOUNDS_URL, "https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip") | Select-Object -Unique
          $ok = $false
          foreach ($u in $urls) {
            foreach ($attempt in 1..4) {
              "Downloading $u (attempt $attempt)"
              curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 5 -o sounds.zip "$u"
              if ($LASTEXITCODE -eq 0 -and (Test-Path sounds.zip) -and (Get-Item sounds.zip).Length -gt 100MB) { $ok = $true; break }
              Remove-Item sounds.zip -ErrorAction SilentlyContinue; Start-Sleep 8
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "could not download the sound library (check the SOUNDS_URL repo variable)" }
          $mb = [math]::Round((Get-Item sounds.zip).Length / 1MB, 1)
          "Downloaded $mb MB"
          # bsdtar reads every zip flavour (Expand-Archive chokes on some)
          New-Item -ItemType Directory -Force presets | Out-Null
          tar.exe -xf sounds.zip -C presets
          $n = (Get-ChildItem presets -Recurse -File).Count
          "Sound library: $n files"
          if ($n -lt 1) { throw "no files extracted from sounds.zip" }

      - name: Pack the encrypted container
        run: |
          cmake --build build --config Release --target NebulaPack
          ./build/NebulaPack_artefacts/Release/NebulaPack.exe presets NebulaTide.ntlib
          ./build/NebulaPack_artefacts/Release/NebulaPack.exe --verify NebulaTide.ntlib

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v.StartsWith("1")) { $v = "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=$v installer\NebulaTide.iss

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\NebulaTide_artefacts\Release\Standalone\Nebula Tide.exe","installer\README.txt" -DestinationPath dist\NebulaTide-Windows-App.zip
          Compress-Archive -Path "build\NebulaTide_artefacts\Release\VST3\Nebula Tide.vst3" -DestinationPath dist\NebulaTide-Windows-VST3.zip
          Copy-Item installer\output\*.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: NebulaTide-Windows
          path: dist/*

  # ──────────────────────────────────────────────────────────────────────────
  macos:
    if: ${{ !startsWith(github.ref, 'refs/heads/ci-') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal Intel + Apple Silicon, macOS 10.13+)
        run: >
          cmake -S . -B build-mac -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build (Standalone + VST3 + AU)
        run: cmake --build build-mac --config Release --target NebulaTide_Standalone NebulaTide_VST3 NebulaTide_AU

      # Optional codesign + notarize — runs only when signing secrets exist.
      # Repo secrets: MAC_CERT_P12 (base64), MAC_CERT_PASSWORD, APPLE_ID,
      # APPLE_TEAM_ID, APPLE_APP_PASSWORD
      - name: Sign & notarize
        if: ${{ env.MAC_CERT_P12 != '' }}
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          IDENTITY=$(security find-identity -v -p codesigning ci.keychain | awk -F'"' 'NR==1{print $2}')
          APP="build-mac/NebulaTide_artefacts/Release/Standalone/Nebula Tide.app"
          codesign --deep --force --options runtime --sign "$IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" NebulaTide-mac.zip
          xcrun notarytool submit NebulaTide-mac.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"

      - name: Fetch sound library
        env:
          SOUNDS_URL: ${{ endsWith(vars.SOUNDS_URL, '.zip') && vars.SOUNDS_URL || 'https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip' }}
        run: |
          echo "Downloading $SOUNDS_URL"
          # GitHub's CDN occasionally resets large downloads: retry on any error, up to 8 times
          # Try the configured URL, then the known-good release asset; retry each on any error.
          ok=0
          for u in "$SOUNDS_URL" "https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip"; do
            for attempt in 1 2 3 4; do
              echo "Downloading $u (attempt $attempt)"
              if curl -L --fail --retry 3 --retry-all-errors --retry-delay 5 -o sounds.zip "$u" \
                 && [ "$(stat -f%z sounds.zip 2>/dev/null || stat -c%s sounds.zip)" -gt 100000000 ]; then ok=1; break; fi
              rm -f sounds.zip; sleep 8
            done
            [ "$ok" = 1 ] && break
          done
          [ "$ok" = 1 ] || { echo "::error::could not download the sound library (check the SOUNDS_URL repo variable)"; exit 1; }
          ls -la sounds.zip
          # bsdtar reads every zip flavour (unzip rejects some); then verify we got files
          mkdir -p presets && tar -xf sounds.zip -C presets
          # repair entries whose names still contain backslashes → real subfolders
          find presets -depth -name '*\\*' | while IFS= read -r f; do
            n="${f//\\//}"; mkdir -p "$(dirname "$n")"; mv "$f" "$n"; done
          COUNT=$(find presets -type f | wc -l | tr -d ' ')
          echo "Sound library: $COUNT files"
          [ "$COUNT" -gt 0 ] || { echo "::error::no files extracted"; exit 1; }

      # One-click macOS installer (.pkg): app → /Applications, VST3 + AU →
      # /Library/Audio/Plug-Ins, sounds → /Library/Application Support.
      - name: Pack the encrypted container
        run: |
          cmake --build build-mac --config Release --target NebulaPack
          PACK=$(find build-mac -name NebulaPack -type f -perm +111 | head -1)
          "$PACK" presets NebulaTide.ntlib
          "$PACK" --verify NebulaTide.ntlib

      - name: Build .pkg installer
        run: |
          V="${GITHUB_REF_NAME#v}"; case "$V" in 1*) ;; *) V="1.0.0";; esac
          R=build-mac/NebulaTide_artefacts/Release
          mkdir -p pkgroot/Applications \
                   "pkgroot/Library/Audio/Plug-Ins/VST3" \
                   "pkgroot/Library/Audio/Plug-Ins/Components" \
                   "pkgroot/Library/Application Support/Nebula Tide"
          cp -R "$R/Standalone/Nebula Tide.app" pkgroot/Applications/
          cp -R "$R/VST3/Nebula Tide.vst3" "pkgroot/Library/Audio/Plug-Ins/VST3/"
          cp -R "$R/AU/Nebula Tide.component" "pkgroot/Library/Audio/Plug-Ins/Components/"
          cp NebulaTide.ntlib "pkgroot/Library/Application Support/Nebula Tide/"

          # remove the old unencrypted folder left by versions up to 1.1.7
          mkdir -p scripts
          cat > scripts/postinstall <<'SH'
          #!/bin/sh
          rm -rf "/Library/Application Support/Nebula Tide/presets"
          rm -rf "/Library/Audio/Plug-Ins/VST3/presets"
          rm -rf "$HOME/Library/Application Support/Nebula Tide/presets"
          exit 0
          SH
          chmod +x scripts/postinstall

          mkdir -p dist
          pkgbuild --root pkgroot --scripts scripts --identifier com.nebulatide.app \
                   --version "$V" --install-location / "dist/NebulaTide-$V-macOS.pkg"

      - name: Package zips
        run: |
          mkdir -p dist
          cd build-mac/NebulaTide_artefacts/Release
          ditto -c -k --keepParent "Standalone/Nebula Tide.app" ../../../dist/NebulaTide-macOS-App.zip
          ditto -c -k --keepParent "VST3/Nebula Tide.vst3" ../../../dist/NebulaTide-macOS-VST3.zip
          ditto -c -k --keepParent "AU/Nebula Tide.component" ../../../dist/NebulaTide-macOS-AU.zip
          cp ../../../installer/README.txt ../../../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: NebulaTide-macOS
          path: dist/*

  # ──────────────────────────────────────────────────────────────────────────
  ios:
    if: ${{ !startsWith(github.ref, 'refs/heads/ci-') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # the library is bundled INTO the iPad app (no downloads after install)
      - name: Fetch sound library
        env:
          SOUNDS_URL: ${{ endsWith(vars.SOUNDS_URL, '.zip') && vars.SOUNDS_URL || 'https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip' }}
        run: |
          ok=0
          for u in "$SOUNDS_URL" "https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip"; do
            for attempt in 1 2 3 4; do
              if curl -L --fail --retry 3 --retry-all-errors --retry-delay 5 -o sounds.zip "$u" \
                 && [ "$(stat -f%z sounds.zip 2>/dev/null || stat -c%s sounds.zip)" -gt 100000000 ]; then ok=1; break; fi
              rm -f sounds.zip; sleep 8
            done
            [ "$ok" = 1 ] && break
          done
          [ "$ok" = 1 ] || { echo "::error::could not download the sound library"; exit 1; }
          mkdir -p presets && tar -xf sounds.zip -C presets
          echo "Sound library: $(find presets -type f | wc -l) files"

      - name: Pack the encrypted container
        run: |
          cmake -S . -B build-pack -G Xcode
          cmake --build build-pack --config Release --target NebulaPack
          PACK=$(find build-pack -name NebulaPack -type f -perm +111 | head -1)
          "$PACK" presets NebulaTide.ntlib
          "$PACK" --verify NebulaTide.ntlib

      - name: Configure (iOS)
        run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      # Unsigned device build proves the iOS code compiles; TestFlight signing
      # and upload use your existing per-app process.
      - name: Build (unsigned)
        run: cmake --build build-ios --config Release --target NebulaTide_Standalone -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: NebulaTide-iOS-unsigned
          path: build-ios/NebulaTide_artefacts/Release/Standalone

  # ──────────────────────────────────────────────────────────────────────────
  # Android: Projucer-generated Gradle project in Builds/Android. Sounds are
  # downloaded by the app on first launch (Play Store size limits), so the
  # APK is small. Signed release APK when ANDROID_KEYSTORE_B64 /
  # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets exist, otherwise a
  # debug-signed APK that can be sideloaded for testing.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Fetch JUCE (same path the project expects)
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git build/_deps/juce-src

      # the library is packed INTO the APK as assets; the app copies it out on
      # first launch (no downloads after install)
      - name: Pack the encrypted container into APK assets
        env:
          SOUNDS_URL: ${{ endsWith(vars.SOUNDS_URL, '.zip') && vars.SOUNDS_URL || 'https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip' }}
        run: |
          ok=0
          for u in "$SOUNDS_URL" "https://github.com/amanorsac/Nebula-Tide/releases/download/v1.0.0/NebulaTide-Sounds-1.1.0.zip"; do
            for attempt in 1 2 3 4; do
              if curl -L --fail --retry 3 --retry-all-errors --retry-delay 5 -o sounds.zip "$u" \
                 && [ "$(stat -c%s sounds.zip)" -gt 100000000 ]; then ok=1; break; fi
              rm -f sounds.zip; sleep 8
            done
            [ "$ok" = 1 ] && break
          done
          [ "$ok" = 1 ] || { echo "::error::could not download the sound library"; exit 1; }
          mkdir -p presets && unzip -q -o sounds.zip -d presets   # GNU tar can't read zips
          rm -rf presets/Stems
          # build the packer and produce the encrypted container
          sudo apt-get -qq update && sudo apt-get -qq install -y libasound2-dev libfreetype-dev \
               libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
               libwebkit2gtk-4.1-dev libgtk-3-dev >/dev/null
          cmake -S . -B build-lin -DCMAKE_BUILD_TYPE=Release
          cmake --build build-lin --target NebulaPack -j
          PACK=$(find build-lin -name NebulaPack -type f -executable | head -1)
          "$PACK" presets NebulaTide.ntlib
          "$PACK" --verify NebulaTide.ntlib
          A="$GITHUB_WORKSPACE/Builds/Android/app/src/main/assets"
          mkdir -p "$A" && cp NebulaTide.ntlib "$A/"
          ls -la "$A"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Projucer's Gradle config signs with Android Studio's default debug
          # keystore, which doesn't exist on a fresh CI machine — create it.
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cd Builds/Android
          chmod +x gradlew
          # on failure, publish an error digest as annotations (publicly readable)
          gradle_run() {
            set +e; ./gradlew --no-daemon --stacktrace "$@" 2>&1 | tee gradle.log; local code=${PIPESTATUS[0]}; set -e
            if [ "$code" != "0" ]; then
              # publish the error digest as annotations (publicly readable via API)
              grep -n -iE "error:|error C|FAILED|What went wrong|undefined reference|No such file|not found|Exception|\.cpp:[0-9]+:[0-9]+" -A3 gradle.log \
                | grep -v "^--$" | cut -c1-400 | tail -60 > digest.txt || true
              split -l 6 digest.txt chunk_
              for c in chunk_*; do
                [ -f "$c" ] || continue
                msg=$(tr '\n' ' ' < "$c" | sed 's/%/%25/g; s/\r//g')
                echo "::error title=Android build::${msg}"
              done
              exit "$code"
            fi
          }
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.keystore
            gradle_run assembleRelease_Release
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            APK=$(find app/build/outputs/apk -iname "*release*.apk" | head -1)
            "$ANDROID_HOME/build-tools/$BT/zipalign" -p 4 "$APK" aligned.apk
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks release.keystore \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --out ../../NebulaTide-Android.apk aligned.apk
          else
            gradle_run assembleDebug_Debug
            cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" ../../NebulaTide-Android-debug.apk
          fi
          ls -la ../../*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NebulaTide-Android
          path: "*.apk"

  # ──────────────────────────────────────────────────────────────────────────
  # On a version tag, collect everything into a GitHub Release so the zips
  # have permanent download links for the website.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Nebula Tide ${{ github.ref_name }}
          files: |
            artifacts/NebulaTide-Windows/*
            artifacts/NebulaTide-macOS/*
            artifacts/NebulaTide-Android/*
